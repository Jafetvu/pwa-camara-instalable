<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspección Visual PWA</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <h1>Inspección Visual PWA</h1>
        <button id="btn-instalar" hidden>Instalar aplicación</button>

        <p id="mensaje-estado" role="status">Cámara inactiva.</p>

        <section aria-label="Visor de cámara">
            <video id="visor-camara" autoplay playsinline muted></video>
        </section>

        <section aria-label="Controles de cámara">
            <button id="btn-preparar-camara" type="button">Solicitar Acceso a Cámara</button>
            <button id="btn-alternar-camara" type="button">Cambiar Cámara</button>
            <button id="btn-apagar-camara" type="button">Apagar Cámara</button>
        </section>

        <section id="aviso-permiso" hidden aria-label="Aviso de privacidad de cámara">
            <h2>Permiso de cámara</h2>
            <p>Esta aplicación requiere acceso a tu cámara únicamente para mostrar una vista previa local en pantalla. Ninguna imagen se envía a servidores externos.</p>
            <button id="btn-confirmar-permiso" type="button">Aceptar y Encender Cámara</button>
        </section>
    </main>

    <script src="./app.js"></script>
</body>
</html>
